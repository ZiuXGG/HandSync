<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <style>
        :root {
  --primary: #38bdf8;
  --primary-dark: #0ea5e9;
  --background: #0f172a;
  --surface: #1e293b;
  --text-primary: #f8fafc;
  --text-secondary: #94a3b8;
  --success: #34d399;
  --error: #f87171;
}

* {
  box-sizing: border-box;
  margin: 0;
  padding: 0;
}

body {
  background: var(--background);
  color: var(--text-primary);
  font-family: 'Inter', system-ui, -apple-system, sans-serif;
  line-height: 1.6;
  min-height: 100vh;
  display: flex;
  flex-direction: column;
}

.main-header {
  padding: 1.5rem 5%;
  background: rgba(15, 23, 42, 0.8);
  backdrop-filter: blur(10px);
  border-bottom: 1px solid rgba(56, 189, 248, 0.1);
}

.main-header h1 {
  font-size: 1.8rem;
  color: var(--primary);
  display: flex;
  align-items: center;
  gap: 0.5rem;
}

.beta-tag {
  font-size: 0.7em;
  background: rgba(56, 189, 248, 0.15);
  color: var(--primary);
  padding: 0.2em 0.6em;
  border-radius: 1em;
}

.container {
  flex: 1;
  display: flex;
  gap: 2rem;
  padding: 2rem 5%;
  max-width: 1600px;
  margin: 0 auto;
  width: 100%;
}

.video-container {
  flex: 1;
  display: flex;
  justify-content: center;
  align-items: center;
  min-height: 70vh; /* Añadir altura mínima */
}

.video-wrapper {
  position: relative;
  width: 100%;
  max-width: 800px;
  aspect-ratio: 4/3; /* Mantener relación de aspecto */
  border-radius: 1.5rem;
  overflow: hidden;
  background: var(--surface);
  box-shadow: 0 0 2rem rgba(56, 189, 248, 0.1);
  display: flex; /* Añadido */
  justify-content: center; /* Añadido */
  align-items: center; /* Añadido */
}


.video-overlay {
  position: absolute;
  bottom: 1rem;
  left: 1rem;
  background: rgba(15, 23, 42, 0.8);
  color: var(--primary);
  padding: 0.5rem 1rem;
  border-radius: 0.5rem;
  font-size: 0.9rem;
  backdrop-filter: blur(5px);
}

h2 {
  font-size: 1.5rem;
  color: var(--text-primary);
  font-weight: 600;
}

.status-indicator {
  position: absolute;
  bottom: 1rem;
  right: 1rem;
  display: flex;
  align-items: center;
  gap: 0.5rem;
  background: rgba(15, 23, 42, 0.8);
  padding: 0.5rem 1rem;
  border-radius: 0.5rem;
  backdrop-filter: blur(5px);
  border: 1px solid rgba(56, 189, 248, 0.1);
  font-size: 0.9rem;
  color: var(--text-primary);
}

.status-dot {
  width: 10px;
  height: 10px;
  border-radius: 50%;
  background: var(--success);
  box-shadow: 0 0 10px var(--success);
}

.version{
  margin-bottom: 13px;
}

.main-footer {
  background: var(--background);
  border-top: 1px solid rgba(56, 189, 248, 0.1);
  padding-top: 1rem;
  padding-bottom: 1rem;
  margin-top: auto;
}

.footer-content {
  display: flex;
  gap: 3rem;
  flex-wrap: wrap;
  max-width: 1200px;
  margin: 0 auto 2rem;
}

.footer-section {
  flex: 1;
  min-width: 250px;
}

.footer-section p{
  margin: 3px;
}

.footer-section p a {
  text-decoration: none;
  color: var(--primary-dark);
  margin-top: 10px;
}


.footer-title {
  color: var(--primary);
  font-size: 1.1rem;
  margin-bottom: 1rem;
  font-weight: 600;
}

.footer-links li {
  margin-bottom: 0.5rem;
}

.footer-links a {
  color: var(--text-secondary);
  text-decoration: none;
  transition: color 0.3s ease;
}

.footer-links a:hover {
  color: var(--primary);
}

.version {
  color: var(--text-secondary);
  font-size: 0.9rem;
}

.model-version {
  color: var(--text-secondary);
  font-size: 0.8rem;
  opacity: 0.8;
}

.copyright {
  text-align: center;
  color: var(--text-secondary);
  font-size: 0.8rem;
  border-top: 1px solid rgba(56, 189, 248, 0.1);
  padding-top: 1.5rem;
  max-width: 100%;
  margin: 0 auto;
}

@media (max-width: 768px) {
  .video-wrapper {
    max-width: 95%;
    border-radius: 1rem;
  }
  
  .video-container {
    min-height: 50vh;
  }
  .footer-content {
      flex-direction: column;
      gap: 2rem;
  }
  
  .footer-section {
      text-align: center;
  }
  
  .footer-links {
      display: flex;
      flex-direction: column;
      align-items: center;
  }
}

@keyframes pulse {
  0%, 80%, 100% { transform: scale(0.5); }
  40% { transform: scale(1); }
}

@media (max-width: 1024px) {
  .container {
      flex-direction: column;
      padding: 1rem;
  }
  
  .video-wrapper {
      border-radius: 1rem;
  }
  
  h2 {
      font-size: 1.3rem;
  }
  
  #output {
      font-size: 1.1rem;
  }
}

@media (max-width: 480px) {
  .main-header h1 {
      font-size: 1.5rem;
  }
  
  .video-overlay {
      font-size: 0.8rem;
      padding: 0.3rem 0.8rem;
  }
  
  #output {
      padding: 1rem;
  }
  .video-feed {
    width: 100%;
    height: 100%;
    display: block;
    background: #000;
    border-radius: 1rem;
    object-fit: cover; /* Mantener relación de aspecto */

}
}

    </style>
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Traductor de Señas - HandSync</title>
</head>
<body>
    <header class="main-header">
        <h1>HandSync <span class="beta-tag">BETA</span></h1>
    </header>
    
    <div class="container">
        <div class="video-container">
            <div class="video-wrapper">
                <img src="{{ url_for('video') }}" class="video-feed" alt="Feed en vivo">
                <div class="video-overlay">Cámara activada</div>
                <div class="status-indicator" aria-live="polite">
                    <div class="status-dot"></div>
                </div>
            </div>
        </div>
        
    </div>
    <footer class="main-footer">
      <div class="footer-content">
          <div class="footer-section">
              <h3 class="footer-title">Recursos</h3>
              <ul class="footer-links">
                  <li><a href="Prueba.pdf" download rel="noopener">Documentación ↗</a></li>
                  <li><a href="#" rel="noopener">Política de privacidad</a></li>
              </ul>
          </div>
          <div class="footer-section">
              <h3 class="footer-title">Versión</h3>
              <p class="version">1.0.0-beta</p>
              <p class="model-version">Modelo ASL v2.4.1</p>
          </div>
          <div class="footer-section">
              <h3 class="footer-title">Contacto</h3>
              <p><a href="https://mail.google.com/mail/u/2/#search/soporte.handsync%40gmail.com">✉️ HandSync</a></p>
              <p><a href="#">🌐 HandSync</a></p>
          </div>
      </div>
      <div class="copyright">
          <p>© 2024 HandSync. Todos los derechos reservados.</p>
          <p>Desarrollado por professionales 🤑</p>
      </div>
  </footer>
    
  <script>
    const checkConnection = () => {
        fetch('/video')
            .then(response => {
                const statusDot = document.querySelector('.status-dot');
                if(response.ok) {
                    statusDot.style.background = 'var(--success)';
                    statusDot.style.boxShadow = '0 0 10px var(--success)';
                } else {
                    statusDot.style.background = 'var(--error)';
                    statusDot.style.boxShadow = '0 0 10px var(--error)';
                }
            })
            .catch(() => {
                statusDot.style.background = 'var(--error)';
                statusDot.style.boxShadow = '0 0 10px var(--error)';
            });
    }

    // Verificar conexión cada 2 segundos
    setInterval(checkConnection, 2000);
    checkConnection(); // Verificación inicial
</script>
</body>
</html>
